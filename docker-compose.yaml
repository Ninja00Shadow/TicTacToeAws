services:
  backend:
    container_name: backend
    build:
      context: ./tictactoe-backend
    # image: ninjashadow/tictactoe:backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      LOCAL_DEV: ${LOCAL_DEV:-true}
      AUTH_MODE: ${AUTH_MODE:-local}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - ./tictactoe-backend:/backend
    stdin_open: true
    tty: true
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    container_name: frontend
    build:
      context: ./tictactoe-frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-ws://localhost:8000}
        REACT_APP_AUTH_MODE: ${REACT_APP_AUTH_MODE:-local}
    # image: ninjashadow/tictactoe:frontend_v1.4
    ports:
      - "80:80"
    # volumes:
    stdin_open: true
    tty: true

networks:
  default:
    driver: bridge

  
